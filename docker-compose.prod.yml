# Allay - Production Overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires .env with secure values for:
#   DB_PASSWORD, JWT_SECRET

services:
  postgres:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
      target: production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-allay}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-allay}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      DATA_DIR: /app/data
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment: {}
    volumes: []
