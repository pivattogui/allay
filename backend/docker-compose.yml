services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: allay
      POSTGRES_PASSWORD: allay
      POSTGRES_DB: allay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      target: development
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://allay:allay@postgres:5432/allay
      JWT_SECRET: development-secret-change-in-production
    volumes:
      - .:/app
      - /app/node_modules
      - server-data:/app/data
    depends_on:
      - postgres

volumes:
  pgdata:
  server-data:
