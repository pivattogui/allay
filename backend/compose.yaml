name: allay-backend

services:
  postgres:
    image: postgres:17-alpine
    container_name: allay-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allay}
      POSTGRES_DB: ${POSTGRES_DB:-allay_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-allay} -d ${POSTGRES_DB:-allay_dev}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
