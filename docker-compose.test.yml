services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: allay_test
      POSTGRES_PASSWORD: allay_test
      POSTGRES_DB: allay_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allay_test"]
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
