# Allay - Production Compose
#
# Self-hosting quick start:
#   curl -O https://raw.githubusercontent.com/pivattogui/allay/main/docker-compose.yml
#   curl -O https://raw.githubusercontent.com/pivattogui/allay/main/.env.example
#   mv .env.example .env
#   # Edit .env: set SECRET_KEY_BASE (mix phx.gen.secret) and DB_PASSWORD
#   docker compose up -d
#
# Open http://localhost:8080 (or whatever ALLAY_PORT is) and create your admin.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-allay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-allay}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-allay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["", "with-db"]

  allay:
    image: ghcr.io/pivattogui/allay:${ALLAY_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${ALLAY_PORT:-8080}:4000"
      - "${MC_PORT_MIN:-25565}-${MC_PORT_MAX:-25575}:${MC_PORT_MIN:-25565}-${MC_PORT_MAX:-25575}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-ecto://${DB_USER:-allay}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-allay}}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required (mix phx.gen.secret)}
      PHX_SERVER: "true"
      ALLAY_PUBLIC_ORIGIN: ${ALLAY_PUBLIC_ORIGIN:-}
      MC_PORT_MIN: ${MC_PORT_MIN:-25565}
      MC_PORT_MAX: ${MC_PORT_MAX:-25575}
      DATA_DIR: /app/data
    volumes:
      - ./data/allay:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
