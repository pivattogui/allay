name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:frontend
      - run: pnpm -F allay-frontend build

  test-backend:
    name: Test Backend (Elixir)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: allay
          POSTGRES_PASSWORD: allay
          POSTGRES_DB: allay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: backend/.tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ hashFiles('backend/.tool-versions') }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ hashFiles('backend/.tool-versions') }}-
      - uses: actions/cache@v4
        with:
          path: backend/priv/plts
          key: plt-${{ runner.os }}-${{ hashFiles('backend/.tool-versions') }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ hashFiles('backend/.tool-versions') }}-
      - run: mix deps.get
      - run: mix check

  build-image:
    name: Build release image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build release image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
