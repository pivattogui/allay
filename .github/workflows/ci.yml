name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: allay_test
          POSTGRES_PASSWORD: allay_test
          POSTGRES_DB: allay_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U allay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:backend
        env:
          JWT_SECRET: test-secret-at-least-16-chars
      - name: Integration tests
        run: pnpm -F allay-backend test:integration
        env:
          DATABASE_URL: postgresql://allay_test:allay_test@localhost:5433/allay_test
          TEST_DATABASE_URL: postgresql://allay_test:allay_test@localhost:5433/allay_test
          JWT_SECRET: test-secret-at-least-16-chars

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:frontend

  test-backend-ex:
    name: Test Backend (Elixir)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ex
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: allay
          POSTGRES_PASSWORD: allay
          POSTGRES_DB: allay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: backend-ex/.tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            backend-ex/deps
            backend-ex/_build
          key: mix-${{ runner.os }}-${{ hashFiles('backend-ex/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: backend-ex/priv/plts
          key: plt-${{ runner.os }}-${{ hashFiles('backend-ex/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
