# Allay - Development Compose
#
# Only Postgres runs in Docker for dev. The backend and frontend run natively:
#   docker compose -f docker-compose.dev.yml up -d        # start postgres
#   cd backend && mix phx.server                       # Phoenix on :4000
#   cd frontend && pnpm dev                               # Vite on :5173 (proxies to :4000)
#   docker compose -f docker-compose.dev.yml down         # stop postgres

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-allay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-allay}
      POSTGRES_DB: ${DB_NAME:-allay}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-allay}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
